name: _Release Klex (Reusable)

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel (stable or nightly)
        required: true
        type: string
      ref:
        description: Immutable commit or ref to build
        required: true
        type: string
      tag:
        description: GitHub Release tag
        required: true
        type: string
      version:
        description: Canonical Klex version
        required: true
        type: string
    secrets:
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_P12_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_ACCOUNT_NAME:
        required: false
      AZURE_ACCOUNT_ENDPOINT_URI:
        required: false
      AZURE_CERTIFICATE_PROFILE_NAME:
        required: false

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: klex-release-${{ inputs.tag }}

env:
  PNPM_VERSION: 11.22.0

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: identity
        name: Resolve immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [[ "${{ inputs.channel }}" != stable && "${{ inputs.channel }}" != nightly ]]; then
            echo "Unsupported release channel: ${{ inputs.channel }}" >&2
            exit 1
          fi
          if [[ "${{ inputs.tag }}" != "v${{ inputs.version }}" ]]; then
            echo "Release tag must be v${{ inputs.version }}" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Validate release code
        run: |
          pnpm --filter '@stagewise/klex^...' build
          pnpm --filter @stagewise/klex exec vitest run scripts/release src/release/release.test.ts scripts/package-exe.test.ts
          pnpm --filter @stagewise/klex typecheck
          pnpm --filter @stagewise/app-packager test
          pnpm --filter @stagewise/app-packager typecheck

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, checks]
    environment: Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: darwin-arm64
          - runner: macos-26-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - runner: ubuntu-22.04
            target: linux-x64-gnu
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(node -p 'process.arch')"
          case "${{ matrix.target }}" in
            *-arm64*) expected=arm64 ;;
            *) expected=x64 ;;
          esac
          test "$actual" = "$expected" || {
            echo "Expected $expected runner, got $actual" >&2
            exit 1
          }

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_P12_PASSWORD }}

      - name: Configure Azure Trusted Signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredSecrets = @{
            AZURE_TENANT_ID = '${{ secrets.AZURE_TENANT_ID }}'
            AZURE_CLIENT_ID = '${{ secrets.AZURE_CLIENT_ID }}'
            AZURE_CLIENT_SECRET = '${{ secrets.AZURE_CLIENT_SECRET }}'
            AZURE_ACCOUNT_ENDPOINT_URI = '${{ secrets.AZURE_ACCOUNT_ENDPOINT_URI }}'
            AZURE_ACCOUNT_NAME = '${{ secrets.AZURE_ACCOUNT_NAME }}'
            AZURE_CERTIFICATE_PROFILE_NAME = '${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}'
          }
          $missingSecrets = @($requiredSecrets.GetEnumerator() |
            Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } |
            ForEach-Object Key)
          if ($missingSecrets.Count -gt 0) {
            throw "Missing Azure Trusted Signing secrets: $($missingSecrets -join ', ')"
          }
          $nugetDir = Join-Path '${{ runner.temp }}' 'nuget'
          $trustedSigningVersion = '1.0.95'
          $sdkBuildToolsVersion = '10.0.22621.3233'
          nuget install Microsoft.Trusted.Signing.Client -Version $trustedSigningVersion -OutputDirectory $nugetDir -Source https://api.nuget.org/v3/index.json
          nuget install Microsoft.Windows.SDK.BuildTools -Version $sdkBuildToolsVersion -OutputDirectory $nugetDir -Source https://api.nuget.org/v3/index.json
          $dlib = Join-Path $nugetDir "Microsoft.Trusted.Signing.Client.$trustedSigningVersion\bin\x64\Azure.CodeSigning.Dlib.dll"
          $signTool = Join-Path $nugetDir "Microsoft.Windows.SDK.BuildTools.$sdkBuildToolsVersion\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $dlib) -or -not (Test-Path $signTool)) {
            throw 'Pinned Azure Trusted Signing tools not found'
          }
          $minimumSignToolVersion = [version]'10.0.22621.755'
          $signToolVersion = (Get-Item $signTool).VersionInfo.FileVersionRaw
          if (-not $signToolVersion -or $signToolVersion -lt $minimumSignToolVersion) {
            throw "SignTool $signToolVersion is older than required version $minimumSignToolVersion"
          }
          $dotnetEightRuntime = dotnet --list-runtimes | Select-String '^Microsoft.NETCore.App 8\.'
          if (-not $dotnetEightRuntime) {
            throw '.NET 8 runtime is required by Azure Trusted Signing'
          }
          Write-Host "Using SignTool $signToolVersion from pinned Windows SDK Build Tools $sdkBuildToolsVersion"
          $metadata = Join-Path '${{ runner.temp }}' 'azure-signing-metadata.json'
          @{
            Endpoint = '${{ secrets.AZURE_ACCOUNT_ENDPOINT_URI }}'
            CodeSigningAccountName = '${{ secrets.AZURE_ACCOUNT_NAME }}'
            CertificateProfileName = '${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}'
          } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata
          "AZURE_CODE_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          "AZURE_METADATA_JSON=$metadata" >> $env:GITHUB_ENV
          "SIGNTOOL_PATH=$signTool" >> $env:GITHUB_ENV

      - name: Build, sign, smoke-test, and archive
        run: >-
          pnpm --filter @stagewise/klex release:artifact --
          --version "${{ inputs.version }}"
          --channel "${{ inputs.channel }}"
          --tag "${{ inputs.tag }}"
          --git-commit "${{ needs.prepare.outputs.commit }}"
          --output-directory release-output
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          KLEX_RELEASE: '1'
          KLEX_RELEASE_CHANNEL: ${{ inputs.channel }}
          KLEX_VERSION: ${{ inputs.version }}

      - name: Enforce Linux glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find apps/klex/release-output -maxdepth 1 -name '*.tar.gz' -print -quit)"
          mkdir glibc-audit
          tar -xzf "$archive" -C glibc-audit
          highest="$(find glibc-audit -type f -exec grep -ahoE 'GLIBC_[0-9]+\.[0-9]+' {} + 2>/dev/null | sort -Vu | tail -1 || true)"
          test -n "$highest" || { echo 'No GLIBC symbol versions found' >&2; exit 1; }
          first="$(printf '%s\n%s\n' GLIBC_2.28 "$highest" | sort -V | head -1)"
          test "$first" = "$highest" || {
            echo "Artifact requires $highest; maximum supported baseline is GLIBC_2.28" >&2
            exit 1
          }

      - name: Upload target artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: klex-${{ matrix.target }}
          path: |
            apps/klex/release-output/*.tar.gz
            apps/klex/release-output/*.zip
            apps/klex/release-output/*.sha256
            apps/klex/release-output/build-metadata-*.json
          retention-days: 14

  aggregate:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: release-output
          pattern: klex-*
      - name: Validate and assemble release metadata
        run: >-
          pnpm --filter @stagewise/klex release:assemble --
          --version "${{ inputs.version }}"
          --channel "${{ inputs.channel }}"
          --tag "${{ inputs.tag }}"
          --git-commit "${{ needs.prepare.outputs.commit }}"
          --repository "${{ github.repository }}"
          --input-directory "../../release-output"
      - name: Extract stable release notes
        if: inputs.channel == 'stable'
        run: >-
          pnpm --filter @stagewise/klex exec tsx
          scripts/release/extract-release-notes.ts --
          --version "${{ inputs.version }}"
          --changelog CHANGELOG.md
          --output "../../release-output/release-notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: klex-release-${{ inputs.version }}
          path: release-output/
          retention-days: 14

  publish:
    needs: [prepare, aggregate]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: klex-release-${{ inputs.version }}
          path: release-output
      - name: Publish immutable stable or rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-output -maxdepth 1 -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o \
            -name 'checksums.txt' -o -name 'release-manifest.json' \
          \) -print | sort)
          if [[ "${#files[@]}" -ne 8 ]]; then
            printf 'Expected 8 public release files, found %s:\n' "${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi

          if [[ "${{ inputs.channel }}" == stable ]]; then
            if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              existing_assets="$(gh release view "${{ inputs.tag }}" \
                --json assets \
                --jq '.assets | length' \
                --repo "${{ github.repository }}")"
              if [[ "$existing_assets" == 8 ]]; then
                echo "Stable release ${{ inputs.tag }} is already complete; leaving it immutable"
                exit 0
              fi
              echo "Stable release ${{ inputs.tag }} exists with $existing_assets assets; refusing to mutate it" >&2
              exit 1
            fi
            test -s release-output/release-notes.md || {
              echo 'Stable release notes are missing or empty' >&2
              exit 1
            }
            gh release create "${{ inputs.tag }}" "${files[@]}" \
              --notes-file release-output/release-notes.md \
              --latest \
              --repo "${{ github.repository }}" \
              --target "${{ needs.prepare.outputs.commit }}" \
              --title "Klex ${{ inputs.version }}" 
          else
            gh release delete "${{ inputs.tag }}" \
              --cleanup-tag \
              --repo "${{ github.repository }}" \
              --yes 2>/dev/null || true
            gh release create "${{ inputs.tag }}" "${files[@]}" \
              --generate-notes \
              --prerelease \
              --repo "${{ github.repository }}" \
              --target "${{ needs.prepare.outputs.commit }}" \
              --title "Klex nightly (${{ inputs.version }})"
          fi

  verify-stable-install:
    name: Verify stable install (${{ matrix.target }})
    needs: [prepare, publish]
    if: inputs.channel == 'stable'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: darwin-arm64
          - runner: macos-26-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - runner: ubuntu-22.04
            target: linux-x64-gnu
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Install, verify, and uninstall (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          KLEX_HOME: ${{ runner.temp }}/klex-data
          KLEX_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/release-manifest.json
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/klex-install"
          sh ./install.sh --install-dir "$root" --no-modify-path
          test -s "$root/install-receipt.json"
          "$root/bin/klex" --verify-native
          test "$("$root/bin/klex" --version)" = "$VERSION"
          sh ./install.sh --install-dir "$root" --uninstall
          test ! -e "$root"
      - name: Install, verify, and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KLEX_HOME: ${{ runner.temp }}\klex-data
          KLEX_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/release-manifest.json
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path '${{ runner.temp }}' 'klex-install'
          & ./install.ps1 -InstallDir $root -NoModifyPath
          if (-not (Test-Path -LiteralPath (Join-Path $root 'install-receipt.json'))) {
            throw 'install receipt was not created'
          }
          & (Join-Path $root 'bin\klex.cmd') --verify-native
          $actual = & (Join-Path $root 'bin\klex.cmd') --version
          if ($actual -ne $env:VERSION) {
            throw "Expected $env:VERSION, got $actual"
          }
          & ./install.ps1 -InstallDir $root -Uninstall
          if (Test-Path -LiteralPath $root) {
            throw 'install root remains after uninstall'
          }

  publish-stable-pointer:
    needs: [prepare, publish, verify-stable-install]
    if: inputs.channel == 'stable'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: klex-channel-stable-pointer
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: klex-release-${{ inputs.version }}
          path: release-output
      - name: Promote the channel-stable pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view channel-stable --repo "$REPO" >/dev/null 2>&1; then
            previous="$(gh release download channel-stable \
              --pattern release-manifest.json \
              --output - \
              --repo "$REPO" 2>/dev/null | jq -r '.version // empty' || true)"
            if [[ -n "$previous" && "$previous" != "$VERSION" ]]; then
              newest="$(printf '%s\n%s\n' "$previous" "$VERSION" | sort -V | tail -n1)"
              if [[ "$newest" != "$VERSION" ]]; then
                echo "Stable pointer is at $previous, newer than $VERSION; leaving it untouched"
                exit 0
              fi
            fi
            mapfile -t existing_assets < <(gh release view channel-stable \
              --json assets --jq '.assets[].name' --repo "$REPO")
            for asset in "${existing_assets[@]}"; do
              if [[ "$asset" != release-manifest.json ]]; then
                echo "Unexpected channel-stable asset: $asset" >&2
                exit 1
              fi
            done
          else
            gh release create channel-stable \
              --notes 'Rolling pointer to the latest verified Klex stable release. Carries release-manifest.json only; binaries and checksums live on the immutable versioned release referenced by the manifest.' \
              --prerelease \
              --repo "$REPO" \
              --target "$COMMIT" \
              --title 'Klex stable (rolling pointer)'
          fi
          gh release upload channel-stable \
            release-output/release-manifest.json \
            --clobber \
            --repo "$REPO"
          gh release edit channel-stable \
            --repo "$REPO" \
            --title "Klex stable (rolling pointer -> $VERSION)"
          test "$(gh release view channel-stable --json assets --jq '.assets | length' --repo "$REPO")" = 1
          test "$(gh release view channel-stable --json assets --jq '.assets[0].name' --repo "$REPO")" = release-manifest.json

  # Rolling pointer giving the installer a fixed nightly URL:
  # releases/download/channel-nightly/release-manifest.json. Nightly tags are
  # unique per build, so no stable download path exists otherwise. Stable uses
  # the equivalent channel-stable pointer after its install verification gate.
  #
  # Split out of `publish` for its own concurrency group. The pointer is the only
  # shared mutable resource here; concurrent runs are otherwise serialized only
  # by their unique versioned tags, which does not protect this.
  #
  # Metadata only: deliberately does not add files to release-output, whose
  # 8-file guard runs in `publish`.
  publish-nightly-pointer:
    needs: [prepare, publish]
    if: inputs.channel != 'stable'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: klex-channel-nightly-pointer
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: klex-release-${{ inputs.version }}
          path: release-output
      - name: Update the channel-nightly pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail

          if gh release view channel-nightly --repo "$REPO" >/dev/null 2>&1; then
            # Monotonic guard: a slower run must not overwrite a newer pointer.
            previous="$(gh release download channel-nightly \
              --pattern release-manifest.json \
              --output - \
              --repo "$REPO" 2>/dev/null | jq -r '.version // empty' || true)"
            if [[ -n "$previous" && "$previous" != "$VERSION" ]]; then
              newest="$(printf '%s\n%s\n' "$previous" "$VERSION" | sort -V | tail -n1)"
              if [[ "$newest" != "$VERSION" ]]; then
                echo "Pointer is at $previous, newer than $VERSION; leaving it untouched"
                exit 0
              fi
            fi
          else
            # The tag is a fixed anchor, not a commit reference: GitHub honours
            # target_commitish only at creation, so it stays at this commit while
            # the assets roll forward. The manifest carries the real gitCommit.
            gh release create channel-nightly \
              --notes 'Rolling pointer to the latest Klex nightly. Carries release-manifest.json only; binaries and their checksums live on the immutable versioned nightly release that the manifest points at. The tag is a fixed anchor -- read gitCommit and version from the manifest.' \
              --prerelease \
              --repo "$REPO" \
              --target "$COMMIT" \
              --title 'Klex nightly (rolling pointer)'
          fi

          # Exactly one mutable asset, deliberately. GitHub Releases has no
          # atomic multi-asset update, so publishing the manifest and a sibling
          # release-manifest.json.sha256 here would let a reader observe a new
          # manifest against the previous checksum and reject a valid nightly.
          #
          # Dropping the sibling loses no integrity: it hashes a manifest served
          # from the same URL and origin, so anyone able to forge one can forge
          # both. The real chain is the manifest's own artifacts[].archiveSha256
          # over binaries hosted on the immutable versioned release, and that
          # release still carries release-manifest.json.sha256 and checksums.txt
          # for out-of-band pinning.
          #
          # The release itself is never deleted, so only this single small asset
          # is briefly absent while --clobber replaces it. Installers must treat
          # a failed pointer fetch as retryable; a missing asset is a clean,
          # self-healing failure, unlike a checksum mismatch that looks like
          # tampering.
          gh release upload channel-nightly \
            release-output/release-manifest.json \
            --clobber \
            --repo "$REPO"
          gh release edit channel-nightly \
            --repo "$REPO" \
            --title "Klex nightly (rolling pointer -> $VERSION)"
