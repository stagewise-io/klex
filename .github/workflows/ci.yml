name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 11.22.0

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  installers:
    name: Installer Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # These two files are fetched and executed straight from the default branch
      # by the documented one-liners, so a broken main is a broken installer for
      # every new user. No Node toolchain is needed here.
      - name: Shellcheck install.sh and its harness
        run: shellcheck --shell=sh install.sh scripts/install-e2e.sh
      - name: Parse install.ps1
        shell: pwsh
        # Parse-only. It catches syntax errors before they reach a user, but it
        # runs under PowerShell 7 on Linux, so it cannot prove 5.1 compatibility
        # or that any Windows-specific call behaves; that still needs a real
        # Windows run.
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref] $null, [ref] $parseErrors) | Out-Null
          if ($parseErrors) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host 'install.ps1 parsed cleanly'

  installer-lock-windows:
    name: Installer Lock End-to-End (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Exercise exclusive installer lock
        shell: pwsh
        run: ./scripts/install-lock-e2e.ps1

  installer-e2e:
    name: Installer End-to-End (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runs install.sh against synthetic file:// artifacts, so it exercises the
      # install, upgrade, PATH, receipt, rollback and uninstall paths without a
      # published release. Both operating systems are covered because the shell
      # startup files, symlink behaviour and coreutils flags differ between them.
      - name: Installer end-to-end
        run: sh scripts/install-e2e.sh

  executable:
    name: Packaged Executable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds an unsigned SEA executable and smoke-tests it, including the
      # --verify-native native addon load probe. No secrets required, so this
      # also runs for pull requests from forks.
      - run: pnpm -F @stagewise/klex test:exe
