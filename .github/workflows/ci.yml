name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Dependency setup lives in .github/actions/setup-workspace. Only pushes to main
# write caches; pull requests read main's entries and never write their own.

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          # Same fail-fast bound as the pnpm store restore in setup-workspace.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-v1-${{ github.job }}-
      - run: pnpm test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/prune-turbo-cache.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          # Same fail-fast bound as the pnpm store restore in setup-workspace.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-v1-${{ github.job }}-
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - name: Verify packed MCP extensions
        run: node scripts/verify-mcp-extension-packages.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/prune-turbo-cache.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}

  klex-machine:
    name: klex-machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs only the root and @klex/machine's dependency closure.
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: machine
          install-filter: --filter klex --filter @klex/machine...
      - run: pnpm --filter @klex/machine... build
      - run: pnpm --filter @klex/machine typecheck
      - run: pnpm --filter @klex/machine test
      - run: pnpm --filter @klex/machine verify

  package-release-scopes:
    name: Package Release Scopes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Test package release scope checker
        run: node --test scripts/check-package-release-scopes.test.mjs
      - name: Verify package release scopes
        run: node scripts/check-package-release-scopes.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  local-data-migrations:
    name: Local Data Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: klex
          install-filter: --filter klex --filter @stagewise/klex...
      - name: Test migration history checker
        run: node --test scripts/check-local-data-migrations.test.mjs
      - name: Verify append-only migration history
        run: node scripts/check-local-data-migrations.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Build workspace dependencies
        run: pnpm --filter '@stagewise/klex^...' build
      - name: Verify runtime registration and frozen startup upgrades
        run: pnpm -F @stagewise/klex test src/local-data-registry src/local-data/local-data-upgrades.test.ts src/config/config-upgrades.test.ts

  installers:
    name: Installer Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # These two files are fetched and executed straight from the default branch
      # by the documented one-liners, so a broken main is a broken installer for
      # every new user. No Node toolchain is needed here.
      - name: Shellcheck install.sh and its harness
        run: shellcheck --shell=sh install.sh scripts/install-e2e.sh apps/klex/container/smoke-image.sh
      - name: Parse install.ps1
        shell: pwsh
        # Parse-only. It catches syntax errors before they reach a user, but it
        # runs under PowerShell 7 on Linux, so it cannot prove 5.1 compatibility
        # or that any Windows-specific call behaves; that still needs a real
        # Windows run.
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref] $null, [ref] $parseErrors) | Out-Null
          if ($parseErrors) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host 'install.ps1 parsed cleanly'

  installer-lock-windows:
    name: Installer Lock End-to-End (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Exercise exclusive installer lock
        shell: pwsh
        run: ./scripts/install-lock-e2e.ps1

  installer-e2e:
    name: Installer End-to-End (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runs install.sh against synthetic file:// artifacts, so it exercises the
      # install, upgrade, PATH, receipt, rollback and uninstall paths without a
      # published release. Both operating systems are covered because the shell
      # startup files, symlink behaviour and coreutils flags differ between them.
      - name: Installer end-to-end
        run: sh scripts/install-e2e.sh

  executable:
    name: Packaged Executable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: klex
          install-filter: --filter klex --filter @stagewise/klex...
      # Builds an unsigned SEA executable and smoke-tests it, including the
      # --verify-native native addon load probe. No secrets required, so this
      # also runs for pull requests from forks.
      - run: pnpm -F @stagewise/klex test:exe

  container:
    name: Container Image (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: klex
          install-filter: --filter klex --filter @stagewise/klex...
      # On ubuntu-24.04-arm this is the only PR gate for arm64 Linux native
      # dependencies; the executable job covers x64 and macOS.
      - run: pnpm -F @stagewise/klex test:exe
      - run: pnpm -F @stagewise/klex container:stage
      # Built locally and never pushed: no registry login, no secrets, so
      # pull requests from forks run this too.
      - name: Build image
        run: |
          docker build -t klex:ci \
            --build-arg KLEX_VERSION="$(node -p "require('./apps/klex/package.json').version")" \
            --build-arg KLEX_REVISION="$GITHUB_SHA" \
            -f apps/klex/container/Dockerfile apps/klex/container/context
      - name: Smoke-test image
        run: sh apps/klex/container/smoke-image.sh klex:ci "$(node -p "require('./apps/klex/package.json').version")"
