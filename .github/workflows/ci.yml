name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run, which would otherwise
# keep holding scarce macOS runners. Pushes to main get one group per commit
# and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependency setup lives in .github/actions/setup-workspace. Only pushes to main
# write caches; pull requests read main's entries and never write their own.

jobs:
  # Pull requests run platform-matrix jobs only for the groups their changes
  # can affect (scripts/ci-changes.mjs). Pushes to main run every group.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.changes.outputs.installer }}
      machine: ${{ steps.changes.outputs.machine }}
      machine-rs: ${{ steps.changes.outputs.machine-rs }}
      executable: ${{ steps.changes.outputs.executable }}
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The pull request merge commit and its base parent.
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ci-changes.test.mjs
      - id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD | node scripts/ci-changes.mjs
          else
            node scripts/ci-changes.mjs --all
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-rust
        with:
          parallel-codegen: ${{ github.event_name == 'pull_request' }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          # Same fail-fast bound as the pnpm store restore in setup-workspace.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-v1-${{ github.job }}-
      - run: pnpm test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/prune-turbo-cache.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-rust
        with:
          parallel-codegen: ${{ github.event_name == 'pull_request' }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          # Same fail-fast bound as the pnpm store restore in setup-workspace.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-v1-${{ github.job }}-
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - name: Verify packed MCP extensions
        run: node scripts/verify-mcp-extension-packages.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/prune-turbo-cache.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-v1-${{ github.job }}-${{ github.sha }}

  # macOS runs these checks in its klex-machine conformance job.
  klex-machine:
    name: klex-machine (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.machine == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs only the root and @klex/machine's dependency closure.
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: machine
          install-filter: --filter klex --filter @klex/machine...
      - run: pnpm --filter @klex/machine... build
      - run: pnpm --filter @klex/machine typecheck
      - run: pnpm --filter @klex/machine test
      - run: pnpm --filter @klex/machine verify

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-tauri-linux
      - run: cargo fmt-check
      - run: cargo lint
      - run: cargo test --workspace --locked
      - name: cargo deny
        run: |
          version=0.22.1
          archive="cargo-deny-$version-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$archive.tar.gz"
          echo "13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$archive/cargo-deny" check

  klex-machine-rs:
    name: klex-machine-rs (${{ matrix.name }}${{ matrix.cross-name && format(' + {0}', matrix.cross-name) || '' }})
    needs: changes
    if: needs.changes.outputs.machine-rs == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # darwin-x64 is cross-compiled in the same job, so it is built but
          # not run. Release builds dominate, so this uses a larger runner.
          - name: darwin-arm64
            os: macos-15-xlarge
            target: aarch64-apple-darwin
            cross-name: darwin-x64
            cross-target: x86_64-apple-darwin
          - name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: win32-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          parallel-codegen: ${{ github.event_name == 'pull_request' }}
          cache-key: ${{ matrix.target }}${{ matrix.cross-target && format('+{0}', matrix.cross-target) || '' }}
      # ring compiles C. cc-rs looks for <arch>-linux-musl-gcc, which
      # musl-tools does not install under that name.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - if: runner.os == 'Linux'
        name: Use musl-gcc for the target
        run: |
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      # ring needs clang for aarch64-pc-windows-msvc.
      - if: runner.os == 'Windows' && runner.arch == 'ARM64'
        name: Put clang on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvm = 'C:\Program Files\LLVM\bin'
            if (-not (Test-Path (Join-Path $llvm 'clang.exe'))) {
              winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Add-Content $env:GITHUB_PATH $llvm
          }
      - run: cargo test --locked --package klex-machine --target ${{ matrix.target }}
      - run: cargo build --release --locked --package klex-machine --bin klex-machine-rs --target ${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/klex-machine-rs --version
      - if: matrix.cross-target
        run: cargo build --release --locked --package klex-machine --bin klex-machine-rs --target ${{ matrix.cross-target }}
      - if: matrix.cross-target
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klex-machine-rs-${{ matrix.cross-name }}
          path: target/${{ matrix.cross-target }}/release/klex-machine-rs
          retention-days: 14
          if-no-files-found: error
      - if: runner.os == 'Linux'
        name: Verify the binary is fully static
        run: |
          binary=target/${{ matrix.target }}/release/klex-machine-rs
          file "$binary"
          file "$binary" | grep -Eq '(static-pie|statically) linked'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klex-machine-rs-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/klex-machine-rs${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 14
          if-no-files-found: error

  # Unsigned debug bundles of Klex Desktop on every desktop OS, proving the
  # app and its installers build. Signed releases: _release-klex-desktop.yml.
  desktop:
    name: Klex Desktop (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          # Tauri compilation dominates, so macOS uses a larger runner.
          - name: darwin-arm64
            os: macos-15-xlarge
          - name: win32-x64
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: desktop
          install-filter: --filter klex --filter @klex/desktop...
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: desktop
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-tauri-linux
      - run: pnpm --filter @klex/desktop typecheck
      - run: pnpm --filter @klex/desktop test
      - run: cargo test --locked --package klex-desktop
      - run: pnpm --filter @klex/desktop tauri build --debug --ci
        env:
          # Builds the Windows app as a GUI-subsystem executable, like release.
          KLEX_DESKTOP_GUI_SUBSYSTEM: '1'
      # The release workflow's install checks, minus signatures.
      - if: runner.os == 'Linux'
        name: Run the AppImage and install the .deb in clean containers
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          apps/desktop/scripts/release/verify-linux.sh \
            target/debug/bundle/appimage/*.AppImage target/debug/bundle/deb/*.deb "$version"
      - if: runner.os == 'macOS'
        name: Verify the disk image
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          apps/desktop/scripts/release/verify-macos.sh target/debug/bundle/dmg/*.dmg "$version"
      - if: runner.os == 'Windows'
        name: Install, verify, and uninstall
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem target/debug/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)" }
          ./apps/desktop/scripts/release/verify-windows.ps1 -Installer $installer[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klex-desktop-${{ matrix.name }}
          path: |
            target/debug/bundle/nsis/*.exe
            target/debug/bundle/dmg/*.dmg
            target/debug/bundle/deb/*.deb
            target/debug/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

  # Linux runs the full conformance suite for both implementations in Unit
  # Tests; this covers the platform-specific PTY and filesystem behaviour.
  # macOS runners are scarce, so a single macOS job runs both implementations
  # and the klex-machine checks. Its release build of klex-machine-rs
  # dominates, so it uses a larger runner.
  klex-machine-conformance:
    name: klex-machine conformance (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.machine == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ts + rust, macos-15-xlarge
            os: macos-15-xlarge
            ts: true
            rust: true
            machine-checks: true
          - name: ts, windows-latest
            os: windows-latest
            ts: true
          - name: rust, windows-latest
            os: windows-latest
            rust: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: machine-conformance
          install-filter: --filter klex --filter @klex/machine-conformance...
      # The Rust run also needs the TypeScript server for takeover tests.
      - run: pnpm --filter @klex/machine... build
      - if: matrix.machine-checks
        run: pnpm --filter @klex/machine typecheck
      - if: matrix.machine-checks
        run: pnpm --filter @klex/machine test
      - if: matrix.machine-checks
        run: pnpm --filter @klex/machine verify
      - run: pnpm --filter @klex/machine-conformance typecheck
      - id: conformance-ts
        if: matrix.ts
        name: Conformance tests (ts)
        run: pnpm --filter @klex/machine-conformance test
        env:
          KLEX_MACHINE_IMPL: ts
      # The Rust build and suite still run when the ts suite fails, so one run
      # reports both implementations.
      - id: setup-rust
        if: matrix.rust && (success() || steps.conformance-ts.outcome == 'failure')
        uses: ./.github/actions/setup-rust
        with:
          parallel-codegen: ${{ github.event_name == 'pull_request' }}
      - id: build-rust
        if: steps.setup-rust.outcome == 'success' && !cancelled()
        run: pnpm --filter @klex/machine-rs build
      - if: steps.build-rust.outcome == 'success' && !cancelled()
        name: Conformance tests (rust)
        run: pnpm --filter @klex/machine-conformance test
        env:
          KLEX_MACHINE_IMPL: rust

  # Drives a real X server (Xvnc) through both implementations: input
  # injection, window listing, capture and the VNC socket stream.
  klex-machine-desktop-x11:
    name: klex-machine desktop (x11, ${{ matrix.implementation }})
    needs: changes
    if: needs.changes.outputs.machine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation:
          - ts
          - rust
    env:
      KLEX_MACHINE_IMPL: ${{ matrix.implementation }}
      KLEX_MACHINE_X11: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/apt-install
        with:
          packages: tigervnc-standalone-server x11-xserver-utils x11-utils xdotool xclip imagemagick
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: machine-conformance
          install-filter: --filter klex --filter @klex/machine-conformance...
      - run: pnpm --filter @klex/machine... build
      - if: matrix.implementation == 'rust'
        uses: ./.github/actions/setup-rust
        with:
          parallel-codegen: ${{ github.event_name == 'pull_request' }}
      - if: matrix.implementation == 'rust'
        run: pnpm --filter @klex/machine-rs build
      - run: pnpm --filter @klex/machine-conformance exec vitest run test/desktop-x11.test.ts

  # Drives the Rust server's Wayland desktop through a scripted
  # xdg-desktop-portal on a private session bus and a real PipeWire daemon
  # fed by a GStreamer test source: portal session, restore token, frames,
  # input and the built-in stream. A real compositor's consent dialog cannot
  # be answered headlessly, so GNOME and KDE are covered by the manual guide.
  klex-machine-desktop-wayland:
    name: klex-machine desktop (wayland, rust)
    needs: changes
    if: needs.changes.outputs.machine == 'true'
    runs-on: ubuntu-24.04
    env:
      KLEX_MACHINE_IMPL: rust
      KLEX_MACHINE_WAYLAND: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/apt-install
        with:
          packages: dbus pipewire pipewire-bin wireplumber gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-pipewire python3-dbus python3-gi
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: machine-conformance
          install-filter: --filter klex --filter @klex/machine-conformance...
      - run: pnpm --filter @klex/machine... build
      - uses: ./.github/actions/setup-rust
        with:
          parallel-codegen: ${{ github.event_name == 'pull_request' }}
      - run: pnpm --filter @klex/machine-rs build
      - run: pnpm --filter @klex/machine-conformance exec vitest run test/desktop-wayland.test.ts

  package-release-scopes:
    name: Package Release Scopes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Test package release scope checker
        run: node --test scripts/check-package-release-scopes.test.mjs
      - name: Verify package release scopes
        run: node scripts/check-package-release-scopes.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  local-data-migrations:
    name: Local Data Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: klex
          install-filter: --filter klex --filter @stagewise/klex...
      - name: Test migration history checker
        run: node --test scripts/check-local-data-migrations.test.mjs
      - name: Verify append-only migration history
        run: node scripts/check-local-data-migrations.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Build workspace dependencies
        run: pnpm --filter '@stagewise/klex^...' build
      - name: Verify runtime registration and frozen startup upgrades
        run: pnpm -F @stagewise/klex test src/local-data-registry src/local-data/local-data-upgrades.test.ts src/config/config-upgrades.test.ts

  installers:
    name: Installer Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # These two files are fetched and executed straight from the default branch
      # by the documented one-liners, so a broken main is a broken installer for
      # every new user. No Node toolchain is needed here.
      - name: Shellcheck install.sh and its harness
        run: shellcheck --shell=sh install.sh scripts/install-e2e.sh apps/klex/container/smoke-image.sh
      - name: Parse install.ps1
        shell: pwsh
        # Parse-only. It catches syntax errors before they reach a user, but it
        # runs under PowerShell 7 on Linux, so it cannot prove 5.1 compatibility
        # or that any Windows-specific call behaves; that still needs a real
        # Windows run.
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref] $null, [ref] $parseErrors) | Out-Null
          if ($parseErrors) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host 'install.ps1 parsed cleanly'

  installer-lock-windows:
    name: Installer Lock End-to-End (Windows)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Exercise exclusive installer lock
        shell: pwsh
        run: ./scripts/install-lock-e2e.ps1

  installer-e2e:
    name: Installer End-to-End (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runs install.sh against synthetic file:// artifacts, so it exercises the
      # install, upgrade, PATH, receipt, rollback and uninstall paths without a
      # published release. Both operating systems are covered because the shell
      # startup files, symlink behaviour and coreutils flags differ between them.
      - name: Installer end-to-end
        run: sh scripts/install-e2e.sh

  executable:
    name: Packaged Executable
    needs: changes
    if: needs.changes.outputs.executable == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: klex
          install-filter: --filter klex --filter @stagewise/klex...
      # Builds an unsigned SEA executable and smoke-tests it, including the
      # --verify-native native addon load probe. No secrets required, so this
      # also runs for pull requests from forks.
      - run: pnpm -F @stagewise/klex test:exe

  container:
    name: Container Image (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.executable == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
        with:
          install-scope: klex
          install-filter: --filter klex --filter @stagewise/klex...
      # On ubuntu-24.04-arm this is the only PR gate for arm64 Linux native
      # dependencies; the executable job covers x64 and macOS.
      - run: pnpm -F @stagewise/klex test:exe
      - run: pnpm -F @stagewise/klex container:stage
      # Built locally and never pushed: no registry login, no secrets, so
      # pull requests from forks run this too.
      - name: Build image
        run: |
          docker build -t klex:ci \
            --build-arg KLEX_VERSION="$(node -p "require('./apps/klex/package.json').version")" \
            --build-arg KLEX_REVISION="$GITHUB_SHA" \
            -f apps/klex/container/Dockerfile apps/klex/container/context
      - name: Smoke-test image
        run: sh apps/klex/container/smoke-image.sh klex:ci "$(node -p "require('./apps/klex/package.json').version")"

  # One stable check for branch protection: skipped jobs count as passing, so
  # path filtering never blocks a merge.
  ci-result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs:
      - changes
      - test
      - build
      - klex-machine
      - rust
      - klex-machine-rs
      - desktop
      - klex-machine-conformance
      - klex-machine-desktop-x11
      - klex-machine-desktop-wayland
      - package-release-scopes
      - local-data-migrations
      - installers
      - installer-lock-windows
      - installer-e2e
      - executable
      - container
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
