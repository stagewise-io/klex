# Publish each npm package independently when a conventional commit on main
# includes its package scope in the comma-separated scope list.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # klex-machine's macOS desktop helper is Swift and builds only on macOS. The
  # release job copies this universal binary into the package it publishes.
  macos-desktop-helper:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Build the universal helper
        run: node mcp-servers/klex-machine/native/macos/build.mjs "$RUNNER_TEMP/macos-desktop-helper/klex-desktop-helper"
      - name: Smoke-test the helper
        run: |
          "$RUNNER_TEMP/macos-desktop-helper/klex-desktop-helper" version
          lipo "$RUNNER_TEMP/macos-desktop-helper/klex-desktop-helper" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klex-machine-macos-desktop-helper
          path: ${{ runner.temp }}/macos-desktop-helper/klex-desktop-helper
          if-no-files-found: error
          retention-days: 1

  release:
    needs: macos-desktop-helper
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: klex-machine-macos-desktop-helper
          path: ${{ runner.temp }}/macos-desktop-helper
      # Every later build, verify and prepack of @klex/machine copies it.
      - name: Use the macOS desktop helper
        run: echo "KLEX_MACHINE_MACOS_HELPER_PREBUILT=$RUNNER_TEMP/macos-desktop-helper/klex-desktop-helper" >> "$GITHUB_ENV"
      - name: Build workspace
        run: pnpm build
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Test workspace
        run: pnpm test
      # Run sequentially because klex-machine rebuilds the SDK while packing;
      # concurrent package verification could clean the SDK dist directory.
      - name: Verify publishable packages
        run: |
          pnpm exec turbo run verify --filter @klex/agent-admin-api
          pnpm exec turbo run verify --filter @klex/mcp-proxy-sdk
          pnpm exec turbo run verify --filter @klex/machine
          node scripts/verify-mcp-extension-packages.mjs
      - name: Check MCP extension release baselines
        run: node scripts/mcp-extension-release-plugin.mjs --preflight
      # Release preparation intentionally rewrites manifests after frozen validation.
      # pnpm 11 requires PNPM_CONFIG_* (not npm_config_*) for this setting.
      # Prevent reinstalls in later release commands and nested prepack builds.
      - name: Release mcp-proxy-sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: >-
          pnpm exec semantic-release
          --extends ./packages/mcp-proxy-sdk/.releaserc.js
      - name: Release mcp-extension-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: >-
          pnpm exec semantic-release
          --extends ./packages/mcp-extension-client/.releaserc.js
      - name: Release mcp-extension-push-notifications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: >-
          pnpm exec semantic-release
          --extends ./packages/mcp-extension-push-notifications/.releaserc.js
      - name: Release mcp-extension-realtime-media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: >-
          pnpm exec semantic-release
          --extends ./packages/mcp-extension-realtime-media/.releaserc.js
      - name: Release klex-machine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: >-
          pnpm exec semantic-release
          --extends ./mcp-servers/klex-machine/.releaserc.js
      - name: Release agent-admin-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: >-
          pnpm exec semantic-release
          --extends ./packages/agent-admin-api/.releaserc.js
