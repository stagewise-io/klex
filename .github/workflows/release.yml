# Package releases — semantic-release with monorepo support.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.22.0

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build publishable packages
        run: pnpm --filter @klex/agent-admin-api build
      - name: Verify publishable packages
        run: pnpm --filter @klex/agent-admin-api verify
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Release changed packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg_dir in packages/*/; do
            [ -f "$pkg_dir.releaserc.js" ] || [ -f "$pkg_dir/.releaserc.js" ] || continue
            echo "::group::Releasing $pkg_dir"
            (cd "$pkg_dir" && pnpm exec semantic-release)
            echo "::endgroup::"
          done
