[workspace]
resolver = "3"
members = ["mcp-servers/klex-machine-rs"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/stagewise-io/klex"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
