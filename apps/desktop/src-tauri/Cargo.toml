[package]
name = "klex-desktop"
version = "0.1.0"
description = "Klex Desktop: connects this computer to Klex Cloud"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "klex_desktop"
path = "src/lib.rs"

[[bin]]
name = "klex-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
klex-machine = { path = "../../../mcp-servers/klex-machine-rs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
url = "2.5.9"

[dev-dependencies]
tempfile = "3.27.0"
