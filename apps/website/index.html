<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Meet Klex Bots: your own team of digital coworkers with their own machines and identities, working with the tools your company already uses."
    />
    <meta
      name="theme-color"
      content="oklch(0.992 0.001 85)"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="oklch(0.234 0.001 85)"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://klex.bot/" />
    <meta property="og:title" content="Klex" />
    <meta
      property="og:description"
      content="Meet Klex Bots: your own team of digital coworkers with their own machines and identities, working with the tools your company already uses."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klex" />
    <meta
      name="twitter:description"
      content="Meet Klex Bots: your own team of digital coworkers with their own machines and identities, working with the tools your company already uses."
    />
    <meta name="twitter:image" content="https://klex.bot/twitter-image.png" />
    <meta name="twitter:image:alt" content="Klex logo" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Klex" />
    <meta name="application-name" content="Klex" />
    <meta property="og:image" content="https://klex.bot/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Klex logo" />

    <link rel="canonical" href="https://klex.bot/" />
    <script>
      document.documentElement.classList.toggle(
        'dark',
        window.matchMedia('(prefers-color-scheme: dark)').matches,
      );
    </script>
    <link rel="preload" href="/fonts/fraunces-500.woff2" as="font" type="font/woff2" crossorigin />
    <title>Klex - Your own team of digital coworkers</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p>Klex is an open-source digital coworker that runs locally. <a href="https://docs.klex.bot">Read the setup guide</a> or <a href="https://github.com/stagewise-io/klex">explore the source</a>. Enable JavaScript to explore the connector examples.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
