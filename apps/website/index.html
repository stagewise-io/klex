<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Meet Klex Bots: your own team of digital coworkers with their own computers and identities, working with the tools your company already uses."
    />
    <meta
      name="theme-color"
      content="oklch(0.992 0.001 85)"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="oklch(0.234 0.001 85)"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.klex.bot/" />
    <meta property="og:title" content="Klex - Your own team of digital coworkers" />
    <meta
      property="og:description"
      content="Meet Klex Bots: your own team of digital coworkers with their own computers and identities, working with the tools your company already uses."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klex - Your own team of digital coworkers" />
    <meta
      name="twitter:description"
      content="Meet Klex Bots: your own team of digital coworkers with their own computers and identities, working with the tools your company already uses."
    />
    <meta name="twitter:image" content="https://www.klex.bot/twitter-image.png" />
    <meta name="twitter:image:alt" content="Klex logo" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Klex" />
    <meta name="application-name" content="Klex" />
    <meta property="og:image" content="https://www.klex.bot/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Klex logo" />
    <meta property="og:site_name" content="Klex" />
    <link rel="canonical" href="https://www.klex.bot/" />
    <script>
      document.documentElement.classList.toggle(
        'dark',
        window.matchMedia('(prefers-color-scheme: dark)').matches,
      );
    </script>
    <link rel="preload" href="/fonts/fraunces-500.woff2" as="font" type="font/woff2" crossorigin />
    <title>Klex - Your own team of digital coworkers</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <style>
        .new-hero h1, .new-hero .new-description, .new-hero .new-hero-cta, .new-hero .new-hero-next { opacity: 1 !important; visibility: visible !important; translate: none !important; transform: none !important; }
        .new-workflow, .new-workflow-viewport, .new-workflow-step-viewport { height: auto !important; overflow: visible !important; }
        .new-workflow-body { display: block !important; }
        .new-workflow-steps { display: block !important; transform: none !important; }
        .new-workflow-step { margin-block: 1.5rem; }
        .new-workflow-description { display: block !important; opacity: 1 !important; mask-image: none !important; }
        .new-workflow-scenes, .new-workflow-mobile-steps, .new-workflow-controls-slot { display: none !important; }
        @layer theme { .new-guides-faq [data-slot="accordion-content"], .new-guides-faq [data-slot="accordion-content"][hidden] { display: block !important; height: auto !important; content-visibility: visible !important; } }
      </style>
      <p>Enable JavaScript to use the interactive examples.</p>
    </noscript>
    <script type="module" src="/src/new/main.ts"></script>
  </body>
</html>
