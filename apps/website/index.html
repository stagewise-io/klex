<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Install Klex, an open-source autonomous digital coworker that runs locally with any model."
    />
    <meta
      name="theme-color"
      content="oklch(0.992 0.001 85)"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="oklch(0.234 0.001 85)"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://klex.bot/" />
    <meta property="og:title" content="Klex" />
    <meta
      property="og:description"
      content="Install Klex, an open-source autonomous digital coworker that runs locally with any model."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klex" />
    <meta
      name="twitter:description"
      content="Install Klex, an open-source autonomous digital coworker that runs locally with any model."
    />
    <meta name="twitter:image" content="https://klex.bot/twitter-image.png" />
    <meta name="twitter:image:alt" content="Klex logo" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Klex" />
    <meta name="application-name" content="Klex" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Klex logo" />
    <meta property="og:site_name" content="Klex" />
    <link rel="canonical" href="https://klex.bot/" />
    <script>
      document.documentElement.classList.toggle(
        'dark',
        window.matchMedia('(prefers-color-scheme: dark)').matches,
      );
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,WONK@0,9..144,400..700,0;1,9..144,400..700,0&amp;display=swap"
    />
    <title>Klex</title>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
