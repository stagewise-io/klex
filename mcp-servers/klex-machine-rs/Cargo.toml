[package]
name = "klex-machine"
version = "0.1.0"
description = "Unrestricted filesystem and persistent shell MCP server"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "klex-machine-rs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
flate2 = "1.1.11"
futures = "0.3.34"
getrandom = "0.4.3"
http-body-util = "0.1.5"
icu_collator = "2.4.0"
ignore = "0.4.35"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indexmap = "2.14.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
portable-pty = "0.9.0"
regex = "1.13.2"
regress = "0.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rmcp = { version = "3.11.0", features = ["server", "transport-streamable-http-server"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.9"
uuid = { version = "1.26.1", features = ["v4"] }
webpki-roots = "1.0.12"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "NSEvent", "block2", "libc"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXValue", "AXError", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFNumber", "CFRunLoop", "CFDate", "CFData", "CFCGTypes", "objc2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGSession", "CGWindow", "CGColorSpace", "CGError", "libc"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSDictionary", "NSError", "NSURL", "NSValue", "NSEnumerator", "block2"] }
unicode-segmentation = "1.12.0"
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-media", "objc2-core-graphics", "SCStream", "SCShareableContent"] }

[target."cfg(target_os = \"linux\")".dependencies]
x11rb = { version = "0.14.0", features = ["image", "xtest"] }
xkeysym = "0.2.1"
zbus = { version = "6.5.0", default-features = false, features = ["tokio"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
