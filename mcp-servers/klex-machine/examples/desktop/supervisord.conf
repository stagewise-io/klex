[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/run/klex/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/klex/supervisor.sock

; VNC listens on a Unix socket only. E2B forwards every localhost TCP port.
[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry 1280x800 -depth 24 -dpi 96 -rfbport -1 -rfbunixpath /run/klex/vnc.sock -rfbunixmode 0600 -SecurityTypes None -nolisten tcp -AlwaysShared
priority=10
autorestart=true
stdout_logfile=/tmp/xvnc.log
redirect_stderr=true

[program:session]
command=/usr/local/bin/desktop-session
priority=20
autorestart=true
stdout_logfile=/tmp/session.log
redirect_stderr=true

; Unauthenticated loopback MCP for local harnesses only.
[program:klex-machine-local]
command=/usr/local/bin/klex-machine serve --mode local --port 3123 --data-dir /home/user/.klex-machine-local --omit-host-details
priority=30
autorestart=true
stdout_logfile=/tmp/klex-machine-local.log
redirect_stderr=true

; Enrolled mode starts once `klex-machine cloud enroll --no-serve` has written an identity.
[program:klex-machine-cloud]
command=/usr/local/bin/klex-machine-cloud
priority=40
autorestart=true
startsecs=0
stdout_logfile=/tmp/klex-machine-cloud.log
redirect_stderr=true
