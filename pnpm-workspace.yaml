packages:
  - apps/*
  - packages/*
  - mcp-servers/*

allowBuilds:
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-arm64': true
  '@ffprobe-installer/linux-x64': true
  '@ffprobe-installer/win32-x64': true
  esbuild: true
  ffmpeg-static: true
  protobufjs: false

minimumReleaseAge: 2880

# First-party packages are trusted and must be consumable immediately after
# publish; the release-age guard exists for third-party supply-chain risk.
minimumReleaseAgeExclude:
  - '@klex/cloud-api'
